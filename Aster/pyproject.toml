[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aster-universe"
version = "0.1.0"
description = "A small explorable particle universe for the desktop"
requires-python = ">=3.10"
dependencies = ["moderngl==5.12.0", "glfw==2.10.2", "numpy>=1.26,<3", "Pillow>=10.4,<13"]

[project.scripts]
aster = "aster.__main__:main"

[tool.setuptools.packages.find]
include = ["aster*"]

[tool.setuptools.package-data]
aster = ["shaders/*.vert", "shaders/*.frag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
